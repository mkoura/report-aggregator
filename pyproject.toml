[build-system]
requires = ["uv_build>=0.9.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "cnt-report-aggregator"
version = "0.1.0"
maintainers = [
    {name = "IOG Cardano Node Test Engineering", email = "martin.kourim@iohk.io"},
]
description = "Reports aggregator for cardano-node-tests"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["cardano", "cardano-node", "cardano-node-tests", "reports"]
license = "Apache-2.0"
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
]
dependencies = [
    "click (>=8.4.1,<9.0.0)",
    "pygithub (>=2.8.1,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
]

[project.urls]
Homepage = "https://github.com/mkoura/report-aggregator"
Repository = "https://github.com/mkoura/report-aggregator"

[project.scripts]
report-aggregator = "report_aggregator.cli:cli"

[dependency-groups]
dev = [
    "mypy (>=1.19.0,<2.0.0)",
    "pre-commit (>=4.5.0,<5.0.0)",
    "types-requests (>=2.32.4.20250913,<3.0.0.0)",
]

[tool.uv.build-backend]
module-name = "report_aggregator"
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ARG", "B", "C4", "C90", "D", "DTZ", "E", "EM", "F", "FURB", "I001", "ISC", "N", "PERF", "PIE", "PL", "PLE", "PLR", "PLW", "PT", "PTH", "Q", "RET", "RSE", "RUF", "SIM", "TRY", "UP", "W", "YTT"]
ignore = ["D10", "D203", "D212", "D213", "D214", "D215", "D404", "D405", "D406", "D407", "D408", "D409", "D410", "D411", "D413", "ISC001", "PLR0912", "PLR0913", "PLR0915", "PT001", "PT007", "PT012", "PT018", "PT023", "PTH123", "RET504", "TRY002", "TRY301", "UP006", "UP007", "UP035", "FURB188"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
show_error_context = true
verbosity = 0
ignore_missing_imports = true
follow_imports = "normal"
no_implicit_optional = true
allow_untyped_globals = false
allow_untyped_defs = false
warn_unused_configs = true
warn_return_any = true
